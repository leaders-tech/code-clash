# This file is the platform-safe Docker shape for tlfpaas and same-origin production routing.
# Edit this file only when the deployment service list or runtime container contract changes.
# Copy a service block here when you add another small deployable service.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_MODE: ${APP_MODE}
      APP_HOST: 0.0.0.0
      APP_PORT: 8081
      DB_PATH: ${DB_PATH}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      BOT_RUNNER_IMAGE: ${BOT_RUNNER_IMAGE}
      BOT_RUNNER_CONTAINER_NAME: ${BOT_RUNNER_CONTAINER_NAME}
    expose:
      - "8081"
    labels:
      tlfpaas.route: "backend"
    restart: unless-stopped
    volumes:
      - sqlite_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  bot-runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: ${BOT_RUNNER_IMAGE}
    command: ["sleep", "infinity"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "8080"
    labels:
      tlfpaas.route: "frontend"
    restart: unless-stopped

volumes:
  sqlite_data:
